    onRoute(q) {
      const path = this.paths[q].join(), sol = this.pairs[q].sol;
      return path === sol.join() || path === sol.slice().reverse().join();
    }

    // A stuck player can ask for one route at a time: the generator's own full-fill solution for that pair.
    hint() {
      if (this.done) return;
      const order = this.pairs.map((p, i) => i);
      if (this.gate && !this.passed) { order.splice(order.indexOf(this.gate.pair), 1); order.unshift(this.gate.pair); }
      const q = order.filter((i) => this.hints.indexOf(i) < 0 && !this.onRoute(i)).concat([-1])[0];
      if (q >= 0) { this.hints.push(q); haptic(8); }
      if (q < 0 || this.hints.length === this.pairs.length) $('#btnHint').hidden = true;
    }

    down(x, y) {
      if (this.done) return;
      const i = this.cellAt(x, y);
      if (i < 0) return;
      let p = this.endpoint[i], cur;
      if (p >= 0) cur = [i]; // touching an item starts its path over from there
      else {
        p = this.paths.findIndex((path) => path.indexOf(i) >= 0);
        if (p < 0) return;
        cur = this.paths[p].slice(0, this.paths[p].indexOf(i) + 1); // touching a path resumes it from that cell
      }
      this.ghost = null;
      if (this.gateGhost) this.gateGhost.dim = true; // the passage demo fades back but stays until the passage is crossed
      this.drag = { p, base: this.paths.map((a) => a.slice()), cur };
      this.sync();
    }

    classify(next) {
      const d = this.drag, cur = d.cur;
      if (cur.indexOf(next) >= 0) return 'retract';
      if (this.isComplete(d.p, cur)) return 'stop';
      const e = this.endpoint[next];
      if (e >= 0) return e === d.p ? 'complete' : 'blocked';
      if (this.cross === 'block') {
        for (let q = 0; q < this.paths.length; q++) if (q !== d.p && this.paths[q].indexOf(next) >= 0) return 'blocked';
      }
      return 'extend';
    }

    move(x, y) {
      const d = this.drag;
      if (!d) return;
      const target = this.cellAt(x, y);
      if (target < 0) return;
      const n = this.n;
      // A fast swipe can skip cells, so walk toward the finger one orthogonal step at a time.
      for (let guard = 0; guard < 40; guard++) {
        const head = d.cur[d.cur.length - 1];
        if (head === target) break;
        const dr = ((target / n) | 0) - ((head / n) | 0), dc = (target % n) - (head % n);
        const vert = dr ? head + Math.sign(dr) * n : -1, horiz = dc ? head + Math.sign(dc) : -1;
        const order = Math.abs(dr) >= Math.abs(dc) ? [vert, horiz] : [horiz, vert];
        let moved = false, blocked = -1;
        for (const next of order) {
          if (next < 0) continue;
          const kind = this.classify(next);
          if (kind === 'blocked') { if (blocked < 0) blocked = next; continue; }
          if (kind === 'stop') continue;
          if (kind === 'retract') d.cur.length = d.cur.indexOf(next) + 1;
          else d.cur.push(next);
          moved = true;
          break;
        }
        if (!moved) { if (blocked >= 0) this.flash(blocked); break; }
      }
      this.sync();
    }

    up() {
      const d = this.drag;
      if (!d) return;
      this.drag = null;
      const changed = d.base.some((path, q) => path.join() !== this.paths[q].join());
      if (changed && d.p !== this.lastMoved) { this.moves++; this.lastMoved = d.p; }
      this.paths = this.paths.map((path) => (path.length <= 1 ? [] : path));
      const solved = this.solved();
      if (solved && this.isFull()) this.finish(true);
      else { this.showServe(solved); this.refreshSorted(); }
    }

    // Rebuild every path from the snapshot taken at touch-down: a path we cut grows back if the finger retreats.
    sync() {
      const d = this.drag, occupied = new Set(d.cur);
      for (let q = 0; q < this.pairs.length; q++) {
        if (q === d.p) { this.paths[q] = d.cur.slice(); continue; }
        const base = d.base[q];
        let k = 0;
        while (k < base.length && !occupied.has(base[k])) k++;
        this.paths[q] = base.slice(0, k);
      }
      let changed = false;
      this.pairs.forEach((p, q) => {
        const now = this.isComplete(q, this.paths[q]);
        if (now && !this.complete[q]) {
          this.pulse[q] = this.t; haptic(10);
          // Same rule as the cup: two of a kind become the next item, shown for a moment above the path.
          const [x, y] = this.center(this.paths[q][this.paths[q].length >> 1]);
          this.pops.push({ x, y, item: p.item + 1, t: 0 });
        }
        if (now !== this.complete[q]) changed = true;
        this.complete[q] = now;
      });
      const passed = this.gatePassed();
      if (passed && !this.passed) {
        const [x, y] = this.center(this.gate.cell);
        this.pops.push({ x, y, amount: PASS_TIPS, t: 0 });
        this.gateGhost = null;
        haptic([8, 30, 8]);
      }
      this.passed = passed;
      if (changed) { this.refreshSorted(); this.refreshHint(); }
    }

    flash(cell) {
      if (this.flashes.some((f) => f.cell === cell)) return;
      this.flashes.push({ cell, t: 0 });
      haptic(6);
    }

    restart() {
      if (this.done) return;
      this.paths = this.pairs.map(() => []);
      this.complete = this.pairs.map(() => false);
      this.passed = false;
      this.moves = 0; this.lastMoved = -1; this.drag = null; this.restarts++;
      this.showServe(false); this.refreshSorted(); this.refreshHint();
    }

    serve() { if (!this.done && this.solved()) this.finish(false); }

    finish(perfect) {
      this.done = true; this.endT = 0;
      this.stamp = { text: perfect ? t('perfect') : t('allSorted'), t: 0 };
      $('#btnServe').hidden = true; $('#btnHint').hidden = true; $('#btnRestart').hidden = true;
      $('#statusPill').textContent = '';
      haptic([12, 50, 12]);
    }

    results() {
      const k = this.pairs.length, filled = this.isFull(), clean = this.moves <= k;
      const lines = [[t('rSorted', { n: k }), 15 * k]];
      if (filled) lines.push([t('rFill'), 40]);
      if (clean) lines.push([t('rClean'), 25]);
      if (this.gatePassed()) lines.push([t('rPass', { amt: plus(PASS_TIPS) }), null]); // paid at the start of the next game
      const total = lines.reduce((sum, l) => sum + (l[1] || 0), 0);
      // Each joined pair becomes the item it makes, waiting as the first drops of the next cup; a perfect fill adds a moka.
      const carry = this.pairs.map((p) => p.item + 1).concat(filled ? [2] : []);
      return {
        kind: 'maze', title: t('maze'), lines, total, seconds: this.activeTime, carry, passBonus: this.gatePassed() ? PASS_TIPS : 0,
        log: { level: this.level, board: this.n + 'x' + this.n, pairs: k, detour: this.detour,
          passage: this.gate ? 1 : 0, passed: this.gatePassed() ? 1 : 0,
          moves: this.moves, filled, clean, cross: this.cross, carried: carry.length, hints: this.hints.length },
      };
    }

    liveScore() { return 0; }

    update(dt) {
      this.t += dt;
      if (!this.done) this.activeTime += dt;
      if (this.ghost) this.ghost.t += dt;
      if (this.gateGhost) this.gateGhost.t += dt;
      if (this.stamp) this.stamp.t += dt;
      // Offer a hint after 40 s without a solution, or after two restarts. Never on the tutorial board.
      if (!this.done && !this.hintOffered && !this.tutorial && (this.activeTime > 40 || this.restarts >= 2)) {
        this.hintOffered = true; $('#btnHint').hidden = false;
      }
      this.flashes = this.flashes.filter((f) => (f.t += dt) < 0.4);
      this.pops = this.pops.filter((p) => (p.t += dt) < 0.9);
      if (this.done) {
        this.endT += dt;
        if (this.endT > 1.0 && !this.reported) { this.reported = true; roundOver(this.results()); }
      }
    }

    draw(c) {
      const { n, cell, bx, by, size } = this;
      // Board plate, printed like the packet: one ink outline and a faint grid.
      rr(c, bx - 6, by - 6, size + 12, size + 12, 16);
      c.fillStyle = theme.card; c.fill(); c.lineWidth = 2; c.strokeStyle = theme.ink; c.stroke();
      c.beginPath();
      for (let i = 1; i < n; i++) {
        c.moveTo(bx + i * cell, by + 2); c.lineTo(bx + i * cell, by + size - 2);
        c.moveTo(bx + 2, by + i * cell); c.lineTo(bx + size - 2, by + i * cell);
      }
      c.lineWidth = 1; c.strokeStyle = theme.rule; c.stroke();

      // Joined pairs tint their cells.
      this.pairs.forEach((p, q) => {
        if (!this.complete[q]) return;
        c.globalAlpha = 0.2; c.fillStyle = p.color;
        for (const i of this.paths[q]) c.fillRect(bx + (i % n) * cell + 1, by + ((i / n) | 0) * cell + 1, cell - 2, cell - 2);
        c.globalAlpha = 1;
      });

      if (this.gate) this.drawGate(c);

      // Paths: a dark casing under the colour keeps them readable on glare-washed screens.
      const w = cell * 0.34;
      c.lineCap = 'round'; c.lineJoin = 'round';
      // Revealed routes sit under the paths as dashed lines in the pair's colour, until that pair is joined: then the
      // player's own path replaces the hint. If the path is cut later, the hint comes back.
      for (const q of this.hints) {
        if (this.complete[q]) continue;
        c.beginPath();
        this.pairs[q].sol.forEach((i, k) => { const [x, y] = this.center(i); if (k) c.lineTo(x, y); else c.moveTo(x, y); });
        c.setLineDash([cell * 0.16, cell * 0.14]);
        c.strokeStyle = theme.casing; c.lineWidth = cell * 0.14 + 3; c.stroke();
        c.strokeStyle = this.pairs[q].color; c.lineWidth = cell * 0.14; c.stroke();
        c.setLineDash([]);
      }
      this.pairs.forEach((p, q) => {
        const path = this.paths[q];
        if (path.length < 2) return;
        c.beginPath();
        path.forEach((i, k) => { const [x, y] = this.center(i); if (k) c.lineTo(x, y); else c.moveTo(x, y); });
        c.strokeStyle = theme.casing; c.lineWidth = w + 5; c.stroke();
        c.strokeStyle = p.color; c.lineWidth = w; c.stroke();
        if (this.complete[q] && !calm()) this.drawFlow(c, path[0] === p.a ? path : path.slice().reverse());
      });

      // Both ends of a pair are the same item, drawn exactly like the pieces in the cup.
      this.pairs.forEach((p, q) => {
        const k = 1 + 0.2 * Math.max(0, 1 - (this.t - this.pulse[q]) / 0.3);
        for (const end of [p.a, p.b]) {
          const [x, y] = this.center(end);
          drawToken(c, p.item, x, y, cell * 0.36 * k);
        }
      });

      if (this.gate) this.drawGateTag(c);
      if (this.gateGhost) this.drawGhostRoute(c, this.gateGhost.route, this.pairs[this.gate.pair].color, this.gateGhost.t, this.gateGhost.dim ? 0.45 : 1);

      // While drawing: a big head that peeks out from under the thumb, plus dots on the cells it can enter next.
      if (this.drag) {
        const d = this.drag, color = this.pairs[d.p].color, head = d.cur[d.cur.length - 1];
        const [hx, hy] = this.center(head);
        const around = [head - n, head + n, head % n ? head - 1 : -1, head % n < n - 1 ? head + 1 : -1];
        for (const nb of around) {
          if (nb < 0 || nb >= this.N) continue;
          const kind = this.classify(nb);
          if (kind !== 'extend' && kind !== 'complete') continue;
          const [x, y] = this.center(nb);
          c.beginPath(); c.arc(x, y, kind === 'complete' ? cell * 0.44 : cell * 0.09, 0, TAU);
          if (kind === 'complete') { c.lineWidth = 3; c.strokeStyle = color; c.stroke(); }
          else { c.fillStyle = color; c.globalAlpha = 0.75; c.fill(); c.globalAlpha = 1; }
        }
        c.beginPath(); c.arc(hx, hy, cell * 0.46, 0, TAU);
        c.globalAlpha = 0.28; c.fillStyle = color; c.fill(); c.globalAlpha = 1;
        c.beginPath(); c.arc(hx, hy, cell * 0.22, 0, TAU);
        c.fillStyle = color; c.fill(); c.lineWidth = 3; c.strokeStyle = theme.casing; c.stroke();
      }

      for (const p of this.pops) {
        const k = p.t / 0.9, y = p.y - (calm() ? 0 : k * cell * 0.7);
        c.globalAlpha = 1 - k * k;
        if (p.amount) {
          c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = theme.card; c.fillStyle = theme.ink;
          drawRuns(c, amountRuns(c, p.amount, Math.round(cell * 0.3)), p.x, y, 'center', true);
        } else drawToken(c, p.item, p.x, y, cell * 0.27);
        c.globalAlpha = 1;
      }

      for (const f of this.flashes) {
        const x = bx + (f.cell % n) * cell, y = by + ((f.cell / n) | 0) * cell;
        c.globalAlpha = 1 - f.t / 0.4;
        rr(c, x + 3, y + 3, cell - 6, cell - 6, cell * 0.2);
        c.lineWidth = 4; c.strokeStyle = theme.warn; c.stroke();
        c.globalAlpha = 1;
      }

      if (this.ghost) this.drawGhost(c);
      if (this.stamp) drawStamp(c, this.stamp.text, VW / 2, by + size / 2, this.stamp.t, false);
    }

    // The passage: a dashed tile painted like the pair that should cross it, with that pair's item in the middle.
    drawGate(c) {
      const g = this.gate, p = this.pairs[g.pair], s = this.cell, [x, y] = this.center(g.cell);
      rr(c, x - s * 0.43, y - s * 0.43, s * 0.86, s * 0.86, s * 0.2);
      c.globalAlpha = this.passed ? 0.42 : 0.2; c.fillStyle = p.color; c.fill(); c.globalAlpha = 1;
      c.setLineDash(this.passed ? [] : [s * 0.11, s * 0.08]);
      c.lineWidth = 5; c.strokeStyle = theme.casing; c.stroke();
      c.lineWidth = 3; c.strokeStyle = p.color; c.stroke();
      c.setLineDash([]);
      drawToken(c, p.item, x, y - s * 0.07, s * 0.19);
    }

    // The reward sits on the passage itself and stays on top of any path, so it is always in sight.
    drawGateTag(c) {
      const s = this.cell, [x, y] = this.center(this.gate.cell);
      const breathe = this.firstPass && !this.passed ? 1 + 0.08 * breath(this.t) : 1;
      // "+20 mance" must fit inside the tile: the type shrinks on small boards rather than spill over the grid.
      let fs = Math.max(9, Math.round(s * 0.2)), runs = amountRuns(c, PASS_TIPS, fs);
      const room = s * 0.96;
      if (runs.width + fs * 0.8 > room) { fs = Math.max(8, Math.floor(fs * room / (runs.width + fs * 0.8))); runs = amountRuns(c, PASS_TIPS, fs); }
      const w = runs.width + fs * 0.8, h = fs * 1.45;
      c.save(); c.translate(x, y + s * 0.27); c.scale(breathe, breathe);
      rr(c, -w / 2, -h / 2, w, h, h / 2);
      c.fillStyle = this.passed ? theme.casing : theme.note; c.fill(); // earned: the tag turns dark
      c.lineWidth = 1.5; c.strokeStyle = theme.casing; c.stroke();
      c.fillStyle = this.passed ? '#FFFFFF' : theme.noteInk; c.textBaseline = 'middle';
      drawRuns(c, runs, 0, fs * 0.06, 'center');
      c.restore();
    }

    // Small beans roll along a joined path.
    drawFlow(c, path) {
      const cell = this.cell, spacing = cell * 0.9, total = (path.length - 1) * cell;
      const offset = (this.t * cell * 1.4) % spacing;
      c.fillStyle = theme.casing;
      for (let s = offset; s < total; s += spacing) {
        const k = Math.min(path.length - 2, Math.floor(s / cell)), f = s / cell - k;
        const [x1, y1] = this.center(path[k]), [x2, y2] = this.center(path[k + 1]);
        c.save(); c.translate(x1 + (x2 - x1) * f, y1 + (y2 - y1) * f); c.rotate(Math.atan2(y2 - y1, x2 - x1));
        c.beginPath(); c.ellipse(0, 0, cell * 0.075, cell * 0.052, 0, 0, TAU); c.fill();
        c.restore();
      }
    }

    // Tutorial: a ghost thumb traces the first route until the player touches the board.
    drawGhost(c) { this.drawGhostRoute(c, this.pairs[0].sol, this.pairs[0].color, this.ghost.t, 1); }

    // A ghost thumb walks a route at a calm pace (fade in, glide with ease, rest at the end, fade out, pause) while
    // the dotted line breathes slowly, swelling and fading once every 4 s.
    drawGhostRoute(c, cells, color, time, alpha) {
      const PER_CELL = 0.65, IN = 0.5, HOLD = 1.6, OUT = 0.8, REST = 0.6;
      const inhale = breath(time), lineW = this.cell * 0.12 * (1 + 0.18 * inhale);
      const travel = (cells.length - 1) * PER_CELL, tt = calm() ? IN + travel : time % (IN + travel + HOLD + OUT + REST);
      if (tt > IN + travel + HOLD + OUT) return;
      const fade = tt < IN ? tt / IN : tt > IN + travel + HOLD ? 1 - (tt - IN - travel - HOLD) / OUT : 1;
      const q = clamp((tt - IN) / travel, 0, 1), eased = q < 0.5 ? 2 * q * q : 1 - Math.pow(2 - 2 * q, 2) / 2;
      const s = eased * (cells.length - 1), k = Math.min(cells.length - 2, Math.floor(s)), f = s - k;
      const [x1, y1] = this.center(cells[k]), [x2, y2] = this.center(cells[k + 1]);
      const gx = x1 + (x2 - x1) * f, gy = y1 + (y2 - y1) * f;
      c.save();
      c.beginPath();
      for (let i = 0; i <= k; i++) { const [x, y] = this.center(cells[i]); if (i) c.lineTo(x, y); else c.moveTo(x, y); }
      c.lineTo(gx, gy);
      c.lineCap = 'round'; c.lineJoin = 'round'; c.setLineDash([this.cell * 0.12, this.cell * 0.12]);
      c.globalAlpha = (0.5 + 0.45 * inhale) * fade * alpha;
      c.lineWidth = lineW + 3; c.strokeStyle = theme.casing; c.stroke();
      c.lineWidth = lineW; c.strokeStyle = color; c.stroke();
      c.setLineDash([]);
      c.beginPath(); c.arc(gx, gy, this.cell * 0.34 * (1 + 0.05 * inhale), 0, TAU);
      c.globalAlpha = 0.42 * fade * alpha; c.fillStyle = theme.ink; c.fill();
      c.globalAlpha = 0.9 * fade * alpha; c.lineWidth = 2.5; c.strokeStyle = theme.card; c.stroke();
      c.restore();
    }
  }

  /* ================= Cup physics (pure, also used by the balance tests) ================= */
  const GRAVITY = 1100;   // cup units / s²
  const STEP = 1 / 240;   // fixed physics step
  const ITERATIONS = 3;   // contact relaxation passes per step
  const FRICTION = 0.04;  // velocity lost per step while touching something
  const TOSS = 80;        // upward kick on release: the throw is felt, the column never changes
  const MAX_RISE = 110;   // cup units / s: nothing moves upward faster, so merges nudge their neighbours instead of launching them
  const COFFEE_SPEED = 5; // cup units / s: the coffee eases up after each drop instead of jumping
  const CUP_HEIGHT = { tight: 92, normal: 104, roomy: 116 };
  // Mostly small items. Keyed by the "Items that drop" setting; each drop is coffee or milk at even odds.
  const SPAWN_WEIGHTS = { 1: [1], 2: [75, 25], 3: [65, 25, 10] };
  // The coffee level: every drop raises it (never time, so looking away is free), up to most of the cup. Fast enough
  // to watch the cup fill and feel it rise; this is what makes even a careful player lose eventually. Tuned with the
  // balance sims so an average player still reaches the top mark in most cups.
  const RISE_PER_DROP = 0.5, MAX_COFFEE = 0.85;
  const SPILL_AFTER = 1.6; // seconds an item must rest above the rim before the cup spills
  // Two identical items that touch stay stuck together this long (about 4 frames at 60 fps), then fuse. Any touch still
  // merges; the wait only puts the contact on screen. A falling item moves several units per frame, so merging on first
  // contact happened between frames: the player saw a gap, then a merged item.
  const MERGE_AFTER = 0.06;

  class CupWorld {
    constructor(height) {
      this.CW = 100; this.CH = height; this.bodies = []; this.events = []; this.uid = 0;
      this.floor = height; this.floorTarget = height; // the coffee surface everything rests on
    }

    add(item, x, y, vy) {
      const r = radiusOf(item);
      const b = { id: ++this.uid, item, r, r0: r, rT: r, x, y, px: x, py: y - vy * STEP, age: 0, over: 0, dead: false, mate: null, mt: 0, contact: false };
      this.bodies.push(b);
      return b;
    }

    setCoffee(level) { this.floorTarget = this.CH - clamp(level, 0, this.CH * MAX_COFFEE); }

    step(h) {
      const B = this.bodies, CW = this.CW, g = GRAVITY * h * h;
      if (this.floor > this.floorTarget) this.floor = Math.max(this.floorTarget, this.floor - COFFEE_SPEED * h); // pushes the pile up
      const F = this.floor;
      for (const b of B) {
        const vx = (b.x - b.px) * 0.999, vy = (b.y - b.py) * 0.999;
        b.px = b.x; b.py = b.y;
        b.x += vx; b.y += vy + g;
        b.age += h;
        b.contact = false;
        if (b.r < b.rT) b.r = Math.min(b.rT, b.r + (b.rT - b.r0) * h * 4); // merged items swell in over ~0.25 s
      }
      let merges = null;
      for (let it = 0; it < ITERATIONS; it++) {
        for (let i = 0; i < B.length; i++) {
          const a = B[i];
          for (let j = i + 1; j < B.length; j++) {
            const b = B[j];
            const dx = b.x - a.x, dy = b.y - a.y, rs = a.r + b.r, d2 = dx * dx + dy * dy;
            if (d2 >= rs * rs) continue;
            if (it === 0 && a.item === b.item && !a.mate && !b.mate) { a.mate = b; b.mate = a; a.mt = b.mt = 0; }
            const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d, push = (rs - d) * 0.8;
            const ma = a.r * a.r, mb = b.r * b.r, inv = 1 / (ma + mb);
            const ax = nx * push * mb * inv, ay = ny * push * mb * inv, bx = nx * push * ma * inv, by = ny * push * ma * inv;
            a.x -= ax; a.y -= ay; b.x += bx; b.y += by;
            // A swelling item makes room by moving its neighbours, without giving them speed.
            if (a.r < a.rT || b.r < b.rT) { a.px -= ax; a.py -= ay; b.px += bx; b.py += by; }
            a.contact = b.contact = true;
          }
        }
        for (const b of B) {
          if (b.x < b.r) { b.x = b.r; b.contact = true; }
          else if (b.x > CW - b.r) { b.x = CW - b.r; b.contact = true; }
          if (b.y > F - b.r) { b.y = F - b.r; b.contact = true; }
        }
      }
      for (const b of B) {
        if (b.contact) { b.px += (b.x - b.px) * FRICTION; b.py += (b.y - b.py) * FRICTION; }
        if (b.py - b.y > MAX_RISE * h) b.py = b.y + MAX_RISE * h;
      }
      // A pair that touched stays touching until it fuses: if a bounce opened a gap, it is pulled shut (weighted by
      // size), which also takes the bounce out.
      for (const a of B) {
        const m = a.mate;
        if (!m || a.id > m.id) continue;
        a.mt += h;
        const dx = m.x - a.x, dy = m.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-4, rs = a.r + m.r;
        if (d > rs) {
          const k = (d - rs) / d, wa = (m.r * m.r) / (a.r * a.r + m.r * m.r);
          a.x += dx * k * wa; a.y += dy * k * wa; m.x -= dx * k * (1 - wa); m.y -= dy * k * (1 - wa);
        }
        if (a.mt >= MERGE_AFTER) (merges || (merges = [])).push([a, m]);
      }
      if (!merges) return;
      for (const [a, b] of merges) {
        if (a.dead || b.dead) continue;
        a.dead = b.dead = true;
        const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
        // The new item keeps only some of the pair's momentum: merging settles the cup rather than stirring it.
        const vx = ((a.x - a.px) + (b.x - b.px)) * 0.2, vy = ((a.y - a.py) + (b.y - b.py)) * 0.2;
        const item = a.item + 1;
        this.events.push({ item, x, y });
        if (ITEMS[item].tier === TOP) continue; // served straight out of the cup: the top of a chain never takes up room
        B.push({ id: ++this.uid, item, r: a.r, r0: a.r, rT: radiusOf(item), x, y, px: x - vx, py: y - vy,
          age: Math.max(a.age, b.age), over: 0, dead: false, mate: null, mt: 0, contact: false });
      }
      this.bodies = B.filter((b) => !b.dead);
    }

    // Where a falling item first touches something: what the guide line and ghost outline show.
    landingY(x, r) {
      let y = this.floor - r;
      for (const b of this.bodies) {
        const dx = b.x - x, rs = r + b.r;
        if (Math.abs(dx) < rs) { const cy = b.y - Math.sqrt(rs * rs - dx * dx); if (cy < y) y = cy; }
      }
      return y;
    }
  }

  // How full the cup looks: the average height of its surface over 20 columns, like a liquid level. Items still
  // falling don't count, and one item poking up doesn't make the cup full on its own.
  function surfaceFill(w) {
    let sum = 0;
    for (let k = 0; k < 20; k++) {
      const x = (k + 0.5) * (w.CW / 20);
      let y = w.floor;
      for (const b of w.bodies) {
        if (b.age <= 0.6) continue;
        const dx = Math.abs(b.x - x);
        if (dx < b.r) y = Math.min(y, b.y - Math.sqrt(b.r * b.r - dx * dx));
      }
      sum += clamp((w.CH - y) / w.CH, 0, 1);
    }
    return sum / 20;
  }

  // The spill rule, shared with the balance tool. Returns 0 safe, 1 warning, 2 spilled. An item counts while it rests
  // above the rim, touching the pile or a wall. In the air its count pauses without resetting, so an item a merge
  // launches past the rim never spills the cup, and dropping onto the top item to keep it bouncing doesn't help either.
  function rimCheck(b, dt) {
    if (b.age <= 0.8 || b.y - b.r >= 0) { b.over = 0; return 0; }
    if (b.contact) b.over += dt;
    if (b.over > SPILL_AFTER) return 2;
    return b.contact || b.over > 0 ? 1 : 0;
  }

  /* ================= Cup scene ================= */
  // Cup drawing extents in cup units: room for the fill marks on the left, the handle on the right.
  const WALL = 2.6, SAUCER_RX = 58, HANDLE_RIGHT = 112;
  const NEXT_FONT = '700 11.5px ' + BODY; // the "POI" / "NEXT" tag on the next-item card
  // After a drop, the waiting item lifts for a moment, then slides into the hand, arriving as the hand frees up (the
  // 0.3 s drop cooldown), once the dropped item has fallen clear. The new next item pops in after the old one left.
  const FLY_DELAY = 0.08, FLY_TIME = 0.22, POP_DELAY = 0.14;
  // Fill marks, like the lines on a milk jug. A mark is kept once reached and serving pays its tip; only a spill
  // loses it. Placed with the balance sims so an average player reaches +25 in nearly every cup and +50 in most.
  const FILL_BONUS = [
    { at: 0.5, tips: 10, key: 'levelHalf' },
    { at: 0.7, tips: 25, key: 'levelNearly' },
    { at: 0.85, tips: 50, key: 'levelBrim' },
  ];
  const fillLevel = (fill) => { let level = null; for (const l of FILL_BONUS) if (fill >= l.at) level = l; return level; };

  class MergeScene {
    constructor(carry, passBonus) {
      this.kind = 'merge';
      this.passBonus = passBonus || 0; // tips earned by crossing the maze's passage, paid here
      const st = save.settings;
      this.spawn = SPAWN_WEIGHTS[st.spawn] ? st.spawn : 2;
      this.milk = st.milk !== false; this.rise = st.rise !== false ? RISE_PER_DROP : 0; this.cupSize = st.cup;
      this.world = new CupWorld(CUP_HEIGHT[st.cup] || CUP_HEIGHT.normal);
      this.tutorial = !save.mergeTutDone;
      // Maze results drop first, biggest first while the cup is still empty. The very first cup then teaches a merge.
      this.carried = (carry || []).slice().sort((a, b) => radiusOf(b) - radiusOf(a));
      this.queue = this.carried.concat(this.tutorial ? [0, 0, 1] : []);
      this.held = this.pull(); this.next = this.pull();
      this.aimX = this.world.CW / 2; this.aiming = false;
      this.cooldown = 0; this.readyT = 1;
      this.acc = 0; this.t = 0; this.activeTime = 0; this.drops = 0;
      this.merges = 0; this.mergePts = 0; this.tops = [0, 0];
      this.reached = new Set(); this.bestItem = -1;
      this.fill = 0; this.fillShown = 0; this.level = null; this.banked = null; this.markHint = -1;
      this.serveShown = false; this.clutch = false; this.bonusNote = 0;
      this.fx = []; this.danger = false; this.hintStage = 0; this.waveAmp = 0.3;
      this.ending = null; this.endT = 0; this.reported = false; this.stamp = null;
      this.ghost = this.tutorial;
      this.layout();
      this.nextPop = 0; this.fly = null; // the next item pops into its card; after a drop it slides into the hand
      this.refreshHint(); this.refreshServe();
      // The passage bonus arrives with the cup: the status capsule announces it for a moment while the counter takes it.
      if (this.passBonus) { this.bonusNote = 2.2; this.refreshServe(); haptic([10, 30, 10]); }
      cv.setAttribute('aria-label', t('cupLabel'));
    }

    pull() {
      if (this.queue.length) return this.queue.shift();
      const weights = SPAWN_WEIGHTS[this.spawn];
      let roll = Math.random() * weights.reduce((a, b) => a + b, 0), tier = weights.length - 1;
      for (let i = 0; i < weights.length; i++) { roll -= weights[i]; if (roll < 0) { tier = i; break; } }
      const family = this.milk && Math.random() < 0.5 ? 1 : 0;
      return family * 4 + tier;
    }

    note(item) {
      this.reached.add(item);
      if (this.bestItem < 0 || ITEMS[item].tier > ITEMS[this.bestItem].tier) this.bestItem = item;
    }

    layout() {
      const top = hudBottom() + 8 + HINT_H + 14;
      // Below the cup: the aim track, then the bottom bar where Serve waits under the thumb.
      const aimZone = clamp(VH * 0.1, 56, 84);
      const floor = VH - BAR_H + 10 - aimZone;
      const maxR = TIER_R[2]; // the biggest item that can be held: a carried moka or latte
      this.hoverY = -(maxR + 3);
      // The fill-mark labels ("+50 mance") keep a fixed pixel size left of the cup, so their width is measured; the rest
      // of the drawing scales, from the labels' right edge to the handle.
      // That column is at least 72 px wide: it also holds the next-item card, on the held item's row.
      const colW = Math.max(72, amountRuns(ctx, FILL_BONUS[FILL_BONUS.length - 1].tips, 11).width);
      const unitsW = HANDLE_RIGHT + WALL + 5, below = this.world.CH + 9, totalH = 2 * maxR + 4 + below;
      this.s = Math.max(0.5, Math.min((VW - colW) / unitsW, (floor - top) / totalH));
      this.marksLeft = (VW - colW - unitsW * this.s) / 2;
      this.ox = this.marksLeft + colW + (WALL + 5) * this.s;
      this.oy = floor - below * this.s;
      this.trackY = floor + aimZone * 0.36;
      // The next item waits in a card left of the cup, on the held item's row, so the queue reads at a glance. It sits
      // between the hint above and the top fill mark below, and left of the fill pointer.
      const hintBottom = this.oy + (this.hoverY - maxR - 1) * this.s - 10;
      const markTop = this.oy + this.world.CH * (1 - FILL_BONUS[FILL_BONUS.length - 1].at) * this.s - 9;
      const left = Math.max(8, this.marksLeft), right = this.ox - (WALL + 7) * this.s;
      ctx.font = NEXT_FONT; const tagW = ctx.measureText(t('next').toUpperCase()).width;
      const R = clamp(Math.min(26, (right - left - 16) / 2, (markTop - hintBottom - 12 - 28) / 2), 12, 26);
      const w = Math.min(right - left, Math.max(2 * R + 16, tagW + 20)), h = 2 * R + 28;
      const cy = clamp(this.oy + this.hoverY * this.s, hintBottom + 6 + 20 + R, markTop - 6 - 8 - R); // token centre
      this.nextCard = { x: (left + right - w) / 2, y: cy - R - 20, w, h, R, cx: (left + right) / 2, cy };
      placeHint(this.oy + (this.hoverY - maxR - 1) * this.s - 10 - HINT_H, Math.max(0, this.marksLeft));
    }

    setAim(px) {
      const r = radiusOf(this.held);
      this.aimX = clamp((px - this.ox) / this.s, r, this.world.CW - r);
    }

    down(x) {
      if (this.ending) return;
      this.aiming = true; this.ghost = false;
      this.setAim(x);
    }

    move(x) { if (this.aiming) this.setAim(x); }

    up(x, y, cancelled) {
      if (!this.aiming) return;
      this.aiming = false;
      if (cancelled) return;
      this.setAim(x);
      this.drop();
    }

    drop() {
      if (this.ending || this.cooldown > 0) return;
      const item = this.held, r = radiusOf(item);
      this.world.add(item, clamp(this.aimX, r, this.world.CW - r), this.hoverY, -TOSS);
      this.note(item);
      this.drops++;
      if (this.rise) this.world.setCoffee(this.drops * this.rise);
      this.held = this.next; this.next = this.pull();
      this.cooldown = 0.3;
      this.aimX = clamp(this.aimX, radiusOf(this.held), this.world.CW - radiusOf(this.held));
      if (this.hintStage === 0) this.hintStage = 1;
      haptic(8);
      this.nextPop = -POP_DELAY; this.fly = { t: 0 };
      this.refreshHint();
    }

    serve() { this.end('served'); }

    refreshHint() {
      const back = this.rise ? t('hintMergeBack') : t('hintMergeBackStill');
      if (this.danger) setHint(t('hintDanger'), true);
      else if (this.markHint >= 0) setHint(t('mark' + (this.markHint + 1), { amt: plus(FILL_BONUS[this.markHint].tips) }));
      else if (this.tutorial && this.drops === 0) setHint(t('hintMerge1'));
      else if (this.drops < this.carried.length) setHint(t('hintMerge2')); // the maze's items drop first: teach the merge
      else if (!this.tutorial) setHint(back);
      else setHint([t('hintMerge1'), t('hintMerge2'), back][this.hintStage]);
    }

    // The bottom bar: the capsule names the next mark; Serve appears under it once a mark is reached (or something
    // goes over the rim), labelled with the tip it pays.
    refreshServe(bump) {
      const show = this.serveShown && !this.ending, btn = $('#btnServe');
      const next = FILL_BONUS.filter((l) => !this.level || l.at > this.level.at)[0];
      $('#statusPill').textContent = this.ending ? '' : this.bonusNote > 0 ? t('bonusNote', { amt: plus(this.passBonus) })
        : !this.level ? t('cupGoal', { amt: plus(FILL_BONUS[0].tips) }) : next ? t('fillNext', { amt: plus(next.tips) }) : t('fillTop');
      btn.hidden = !show;
      btn.classList.toggle('urgent', show && this.danger);
      if (!show) return;
      $('#serveLabel').textContent = this.level ? t('serveBonus', { amt: plus(this.level.tips) }) : t('serve');
      if (bump && !calm()) { btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump'); }
    }

    // Marks are kept once reached: a merge that lowers the pile never takes a tip away. Only a spill does.
    reachMark(level) {
      this.level = level; this.serveShown = true; this.markHint = FILL_BONUS.indexOf(level);
      this.fx.push({ kind: 'mark', at: level.at, t: 0 });
      haptic([10, 40, 10]);
      this.refreshServe(true); this.refreshHint();
    }

    liveScore() { return this.passBonus + this.mergePts + (this.tops[0] + this.tops[1]) * TIER_PTS[TOP] + (this.banked ? this.banked.tips : 0); }

    end(kind) {
      if (this.ending) return;
      this.ending = kind; this.endT = 0; this.aiming = false;
      this.banked = kind === 'served' ? this.level : null;
      // Serving while something is already over the rim still counts: the warning is a chance, not a verdict.
      this.clutch = kind === 'served' && this.danger;
      let text;
      if (kind === 'spill') text = t('spilled');
      else if (this.clutch) text = this.banked ? t('clutchBonus', { amt: plus(this.banked.tips) }) : t('clutch');
      else text = this.banked ? t('servedBonus', { amt: plus(this.banked.tips) }) : t('served');
      this.stamp = { text, t: 0, warn: kind === 'spill' };
      haptic(kind === 'spill' ? 40 : [12, 50, 12]);
      this.refreshServe();
      if (this.banked) updateTips(true);
    }

    results() {
      const lines = (this.passBonus ? [[t('rPassBonus'), this.passBonus]] : []).concat([[t('rMerges', { n: this.merges }), this.mergePts]]);
      for (let f = 0; f < 2; f++) {
        if (this.tops[f]) lines.push([t('rTop', { item: itemName(f * 4 + TOP), n: this.tops[f] }), this.tops[f] * TIER_PTS[TOP]]);
      }
      if (this.bestItem >= 0) lines.push([t('rBest', { item: itemName(this.bestItem) }), null]);
      if (this.ending === 'spill') lines.push([t('rSpilled'), null]);
      else if (this.banked) lines.push([t('rServedAt', { level: t(this.banked.key) }), this.banked.tips]);
      else lines.push([t('rServed'), null]);
      return {
        kind: 'merge', title: t('merge'), lines, total: this.liveScore(), seconds: this.activeTime, reached: Array.from(this.reached),
        log: { drops: this.drops, ending: this.ending, best_tier: this.bestItem >= 0 ? ITEMS[this.bestItem].tier + 1 : 0,
          merges: this.merges, tops: this.tops[0] + this.tops[1], carried: this.carried.length, fill: Math.round(this.fill * 100),
          serve_bonus: this.banked ? this.banked.tips : 0, clutch: this.clutch ? 1 : 0, pass_bonus: this.passBonus,
          cup: this.cupSize, spawn: this.spawn, milk: this.milk ? 1 : 0, rise: this.rise ? 1 : 0 },
      };
    }

    update(dt) {
      this.t += dt;
      if (!this.ending) this.activeTime += dt;
      if (this.cooldown > 0) { this.cooldown -= dt; if (this.cooldown <= 0) this.readyT = 0; }
      if (this.bonusNote > 0) { this.bonusNote -= dt; if (this.bonusNote <= 0) this.refreshServe(); }
      else this.readyT += dt;
      this.nextPop += dt;
      if (this.fly) this.fly.t += dt;

      this.acc = Math.min(this.acc + dt, 0.1);
      while (this.acc >= STEP) { this.world.step(STEP); this.acc -= STEP; }
      // The coffee surface stirs while it rises after a drop, then settles to a slow sway.
      const rising = this.world.floor - this.world.floorTarget > 0.01;
      this.waveAmp += ((rising ? 1.2 : 0.3) - this.waveAmp) * Math.min(1, dt * 5);

      let scored = false;
      for (const ev of this.world.events) {
        const tier = ITEMS[ev.item].tier, pts = TIER_PTS[tier], r = radiusOf(ev.item);
        if (tier === TOP) {
          this.tops[familyOf(ev.item)]++;
          this.fx.push({ kind: 'flyout', item: ev.item, x: ev.x, y: ev.y, t: 0 });
        } else { this.merges++; this.mergePts += pts; }
        this.note(ev.item);
        this.fx.push({ kind: 'ring', x: ev.x, y: ev.y, r, color: ITEMS[ev.item].color, t: 0 });
        this.fx.push({ kind: 'pop', x: ev.x, y: ev.y - r, amount: pts, t: 0 });
        haptic(tier === TOP ? [20, 40, 20] : 12);
        if (this.hintStage < 2) { this.hintStage = 2; this.refreshHint(); }
        scored = true;
      }
      this.world.events.length = 0;
      if (scored) updateTips(true);
      this.fx = this.fx.filter((f) => (f.t += dt) < (f.kind === 'pop' ? 0.9 : f.kind === 'flyout' ? 0.8 : f.kind === 'mark' ? 0.6 : 0.4));
      if (this.stamp) this.stamp.t += dt;

      this.fill = surfaceFill(this.world);
      this.fillShown += (this.fill - this.fillShown) * Math.min(1, dt * 6);
      if (!this.ending) {
        const level = fillLevel(this.fill);
        if (level && (!this.level || level.at > this.level.at)) this.reachMark(level);
      }

      // Overflow: an item resting above the rim for 1.6 s spills the cup.
      let danger = false;
      if (!this.ending) {
        for (const b of this.world.bodies) {
          const state = rimCheck(b, dt);
          if (state) danger = true;
          if (state === 2) { this.end('spill'); break; }
        }
      }
      if (danger !== this.danger) {
        this.danger = danger;
        if (danger) this.serveShown = true; // Serve is always within reach while the cup is in danger
        this.refreshHint(); this.refreshServe();
      }
      if (this.ending) {
        this.endT += dt;
        if (this.endT > 1.2 && !this.reported) { this.reported = true; roundOver(this.results()); }
      }
    }

    draw(c) {
      const w = this.world, s = this.s, CW = w.CW, CH = w.CH, px = 1 / s;
      this.drawAim(c);

      c.save(); c.translate(this.ox, this.oy); c.scale(s, s);
      c.lineJoin = 'round'; c.lineCap = 'round';
      // Saucer and handle.
      c.beginPath(); c.ellipse(CW / 2, CH + WALL + 2, SAUCER_RX, 3.6, 0, 0, TAU);
      c.fillStyle = theme.card; c.fill(); c.lineWidth = 2 * px; c.strokeStyle = theme.ink; c.stroke();
      c.beginPath(); c.ellipse(CW + WALL, CH * 0.42, 7, CH * 0.18, 0, -Math.PI / 2, Math.PI / 2);
      c.lineWidth = WALL * 1.1; c.strokeStyle = theme.ink; c.stroke();
      // Interior, the coffee, then the walls drawn just outside the physics boundary.
      const cr = 6;
      const interior = () => {
        c.beginPath(); c.moveTo(0, 0); c.lineTo(0, CH - cr); c.arcTo(0, CH, cr, CH, cr); c.lineTo(CW - cr, CH);
        c.arcTo(CW, CH, CW, CH - cr, cr); c.lineTo(CW, 0); c.closePath();
      };
      interior(); c.fillStyle = theme.card; c.fill();
      if (w.floor < CH - 0.01) {
        // The coffee: a crema band on a wavy surface, over dark coffee.
        const amp = calm() ? 0 : this.waveAmp, ph = this.t * 2.6;
        const surface = (dy) => {
          c.beginPath(); c.moveTo(0, CH + 1);
          for (let x = 0; x <= CW; x += 4) c.lineTo(x, w.floor + dy + Math.sin(x * 0.11 + ph) * amp);
          c.lineTo(CW, CH + 1); c.closePath();
        };
        c.save(); interior(); c.clip();
        surface(0); c.fillStyle = '#C9955F'; c.fill();
        surface(2.4); c.fillStyle = '#5A3418'; c.fill();
        c.restore();
      }
      const o = WALL / 2;
      c.beginPath(); c.moveTo(-o, -0.5); c.lineTo(-o, CH - cr); c.arcTo(-o, CH + o, cr, CH + o, cr + o);
      c.lineTo(CW - cr, CH + o); c.arcTo(CW + o, CH + o, CW + o, CH - cr, cr + o); c.lineTo(CW + o, -0.5);
      c.lineWidth = WALL; c.strokeStyle = theme.ink; c.stroke();
      // Fill marks on the outside of the left wall; the ones already reached are drawn in full ink.
      for (const lvl of FILL_BONUS) {
        const y = CH * (1 - lvl.at), on = !!this.level && lvl.at <= this.level.at;
        c.beginPath(); c.moveTo(-WALL - 4, y); c.lineTo(-o, y);
        c.lineWidth = (on ? 2.4 : 1.6) * px; c.strokeStyle = on ? theme.ink : theme.ink2; c.stroke();
      }
      // The fill pointer: where the cup's surface is now, sliding up past the marks.
      const fy = CH * (1 - clamp(this.fillShown, 0, 1));
      c.beginPath(); c.moveTo(-o - 0.3, fy); c.lineTo(-WALL - 4.4, fy - 2.5); c.lineTo(-WALL - 4.4, fy + 2.5); c.closePath();
      c.fillStyle = theme.ink; c.fill();
      // The rim is the limit: dashed while safe, pulsing warning colour while something sits above it.
      c.setLineDash([2.6, 2.2]);
      c.globalAlpha = this.danger ? (calm() ? 1 : 0.55 + 0.45 * Math.sin(this.t * 14)) : 0.6;
      c.lineWidth = (this.danger ? 3.5 : 1.8) * px; c.strokeStyle = this.danger ? theme.warn : theme.ink2;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(CW, 0); c.stroke();
      c.setLineDash([]); c.globalAlpha = 1;

      for (const b of w.bodies) drawToken(c, b.item, b.x, b.y, b.r);

      // The held item, its landing column and a ghost of where it first touches.
      if (!this.ending && this.cooldown <= 0) {
        const r = radiusOf(this.held), x = clamp(this.aimX, r, CW - r), ly = w.landingY(x, r);
        const appear = calm() || this.fly ? 1 : clamp(this.readyT / 0.15, 0, 1);
        if (ly - r > this.hoverY + r) {
          c.globalAlpha = 0.55 * appear; c.setLineDash([2, 2]); c.lineWidth = 1.6 * px; c.strokeStyle = theme.ink;
          c.beginPath(); c.moveTo(x, this.hoverY + r + 1); c.lineTo(x, ly - r); c.stroke();
          c.beginPath(); c.arc(x, ly, r, 0, TAU); c.lineWidth = 2 * px; c.stroke();
          c.setLineDash([]); c.globalAlpha = 1;
        }
        const bob = calm() || this.aiming ? 0 : Math.sin(this.t * 3) * 0.8;
        c.save(); c.translate(x, this.hoverY + bob); c.scale(appear, appear);
        drawToken(c, this.held, 0, 0, r);
        c.restore();
      }

      for (const f of this.fx) {
        if (f.kind === 'ring') {
          const k = f.t / 0.4;
          c.globalAlpha = 1 - k; c.lineWidth = 2.5 * px; c.strokeStyle = f.color;
          c.beginPath(); c.arc(f.x, f.y, f.r * (1 + 0.7 * k), 0, TAU); c.stroke();
          c.globalAlpha = 1;
        } else if (f.kind === 'mark') {
          const k = f.t / 0.6;
          c.globalAlpha = 1 - k; c.lineWidth = 2 * px; c.strokeStyle = theme.ink;
          c.beginPath(); c.arc(-WALL - 2.4, CH * (1 - f.at), 3 + k * 7, 0, TAU); c.stroke();
          c.globalAlpha = 1;
        } else if (f.kind === 'flyout') {
          // The top of a chain lifts out of the cup and is gone.
          const k = f.t / 0.8, y = f.y - (calm() ? 0 : k * (f.y + 40));
          c.globalAlpha = 1 - k * k;
          drawToken(c, f.item, f.x, y, TIER_R[TOP] * (0.85 + 0.25 * Math.min(1, f.t / 0.15)));
          c.globalAlpha = 1;
        }
      }
      c.restore();

      // Fill-mark tips and floating points, in screen pixels so they stay legible on small cups.
      c.font = '700 11px ' + BODY; c.textAlign = 'right'; c.textBaseline = 'middle';
      for (const lvl of FILL_BONUS) {
        c.fillStyle = this.level && lvl.at <= this.level.at ? theme.ink : theme.ink2;
        drawRuns(c, amountRuns(c, lvl.tips, 11), this.ox + (-WALL - 5) * s, this.oy + CH * (1 - lvl.at) * s, 'right');
      }
      if (!this.ending) this.drawNext(c);
      const popSize = clamp(VW * 0.05, 15, 20);
      c.lineJoin = 'round';
      for (const f of this.fx) {
        if (f.kind !== 'pop') continue;
        const k = f.t / 0.9, x = this.ox + f.x * s, y = this.oy + f.y * s - (calm() ? 0 : k * 26);
        c.globalAlpha = 1 - k * k;
        c.lineWidth = 4; c.strokeStyle = theme.card; c.fillStyle = theme.ink;
        drawRuns(c, amountRuns(c, f.amount, popSize), x, y, 'center', true);
        c.globalAlpha = 1;
      }

      if (this.ghost) this.drawGhost(c);
      if (this.stamp) drawStamp(c, this.stamp.text, VW / 2, this.oy + CH * s * 0.45, this.stamp.t, this.stamp.warn);
    }

    // The next item: a white card with its tag, the item sized by tier (small, medium, large). After a drop the item
    // that was waiting slides from the card to the hand while the new one pops in, so the order is never in doubt.
    drawNext(c) {
      const n = this.nextCard, sizeOf = (item) => n.R * [0.72, 0.86, 1][ITEMS[item].tier];
      rr(c, n.x, n.y, n.w, n.h, 12); c.fillStyle = theme.card; c.fill(); c.lineWidth = 2; c.strokeStyle = theme.ink; c.stroke();
      c.font = NEXT_FONT; c.fillStyle = theme.ink2; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
      c.fillText(t('next').toUpperCase(), n.x + n.w / 2, n.y + 15);
      const pop = calm() ? 1 : easeOutBack(clamp(this.nextPop / 0.22, 0, 1));
      if (pop > 0) drawToken(c, this.next, n.cx, n.cy, sizeOf(this.next) * pop);
      if (!this.fly || this.cooldown <= 0 || calm()) return;
      const k = clamp((this.fly.t - FLY_DELAY) / FLY_TIME, 0, 1), e = k * k * (3 - 2 * k), r = radiusOf(this.held);
      const tx = this.ox + clamp(this.aimX, r, this.world.CW - r) * this.s, ty = this.oy + this.hoverY * this.s;
      drawToken(c, this.held, n.cx + (tx - n.cx) * e, n.cy + (ty - n.cy) * e, sizeOf(this.held) + (r * this.s - sizeOf(this.held)) * e);
    }

    // The aim track mirrors the finger: absolute x mapping, so the thumb stays low and never covers the cup.
    drawAim(c) {
      const s = this.s, y = this.trackY;
      const x0 = this.ox + TIER_R[0] * s, x1 = this.ox + (this.world.CW - TIER_R[0]) * s;
      c.lineCap = 'round'; c.lineWidth = 6; c.strokeStyle = theme.rule;
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
      if (!this.ending) {
        const kx = this.ox + this.aimX * s;
        c.beginPath(); c.arc(kx, y, this.aiming ? 15 : 11, 0, TAU);
        c.fillStyle = ITEMS[this.held].color; c.fill(); c.lineWidth = 2.5; c.strokeStyle = theme.casing; c.stroke();
      }
      c.font = '600 13px ' + BODY; c.fillStyle = theme.ink2; c.textAlign = 'center'; c.textBaseline = 'top';
      c.fillText('←  ' + t('aim') + '  →', (x0 + x1) / 2, y + 20);
    }

    drawGhost(c) {
      const range = this.world.CW * this.s * 0.28, cx = this.ox + (this.world.CW / 2) * this.s;
      const gx = cx + Math.sin(this.t * 2.2) * range, gy = this.trackY;
      c.save();
      c.beginPath(); c.arc(gx, gy, 22, 0, TAU);
      c.globalAlpha = 0.18; c.fillStyle = theme.ink; c.fill();
      c.globalAlpha = 0.7; c.lineWidth = 2.5; c.strokeStyle = theme.ink; c.stroke();
      c.restore();
    }
  }

  /* ================= Visit flow ================= */
  const visit = { round: 0, tips: 0, rounds: [], carry: [], passBonus: 0 };
  const roundKind = (n) => (n % 2 === 1 ? 'maze' : 'merge');

  function startVisit() {
    visit.round = 0; visit.tips = 0; visit.rounds = []; visit.carry = []; visit.passBonus = 0;
    $('#home').hidden = true;
    nextRound();
  }

  function nextRound() {
    hideSheets();
    visit.round++;
    const kind = roundKind(visit.round);
    $('#top').hidden = false; $('#status').hidden = false;
    $('#hudRound').textContent = t('round', { n: visit.round });
    $('#hudName').innerHTML = headerHTML(t(kind));
    $('#btnRestart').hidden = kind !== 'maze';
    $('#bottomBar').hidden = false; $('#btnHint').hidden = true;
    $('#btnServe').hidden = true; $('#btnServe').classList.remove('urgent');
    disarmQuit();
    if (kind === 'maze') scene = new MazeScene(save.mazeLevel);
    else { scene = new MergeScene(visit.carry, visit.passBonus); visit.carry = []; visit.passBonus = 0; }
    updateTips(kind === 'merge' && scene.passBonus > 0);
  }

  function updateTips(bump) {
    const el = $('#hudTips');
    el.textContent = visit.tips + (scene ? scene.liveScore() : 0);
    if (bump && !calm()) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 160); }
  }

  function roundOver(res) {
    recordRound(res);
    showRoundReceipt(res);
  }

  function recordRound(res) {
    visit.tips += res.total;
    visit.rounds.push({ n: visit.round, title: res.title, total: res.total });
    if (res.kind === 'maze') {
      if (!res.log.hints) save.mazeLevel++; // a maze solved with a hint is replayed at the same difficulty
      if (res.log.passage) save.passTutDone = true;
      visit.carry = res.carry;
      visit.passBonus = res.passBonus || 0;
    }
    else {
      save.mergeTutDone = true;
      const ever = new Set(save.everItems);
      res.reached.forEach((item) => ever.add(item));
      save.everItems = Array.from(ever);
    }
    const rec = { ts: new Date().toISOString(), round: visit.round, kind: res.kind, seconds: Math.round(res.seconds * 10) / 10, tips: res.total };
    save.log.push(Object.assign(rec, res.log));
    if (save.log.length > 300) save.log.splice(0, save.log.length - 300);
    persist();
    $('#hudTips').textContent = visit.tips;
  }

  function finishVisit() {
    // A passage bonus waiting for a next game that never came still counts: nothing earned is lost.
    if (visit.passBonus) { visit.tips += visit.passBonus; visit.rounds.push({ bonus: visit.passBonus }); visit.passBonus = 0; }
    const prevBest = save.best;
    save.best = Math.max(save.best, visit.tips);
    save.lifetime += visit.tips;
    persist();
    scene = null;
    $('#top').hidden = true; $('#status').hidden = true; $('#bottomBar').hidden = true;
    showVisitReceipt(prevBest);
  }

  function showHome() {
    scene = null;
    hideSheets();
    $('#top').hidden = true; $('#status').hidden = true; $('#bottomBar').hidden = true; $('#home').hidden = false;
    $('#homeBest').textContent = save.best > 0 ? t('bestVisit', { n: save.best }) : t('firstVisit');
    cv.setAttribute('aria-label', 'Pausa Caffè');
    requestAnimationFrame(() => drawChain($('#chainCv')));
  }

  /* ================= Receipts ================= */
  let sheetMode = 'round';

  function stampNow() {
    try {
      return new Intl.DateTimeFormat(lang === 'it' ? 'it-IT' : 'en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date());
    } catch (e) { return ''; }
  }

  const lineHTML = ([label, amount]) =>
    `<div class="rc-line"><span>${esc(label)}</span><span>${amount == null ? '' : esc(amount)}</span></div>`;

  const COFFEE_IT_URL = 'https://coffeeit.com/en/homepage/';
  const PORTFOLIO_URL = 'https://alessandropesetti.com';

  function receiptHTML({ sub, lines, totalLabel, total, after = [], chain = false, carry = null, link = false }) {
    return `<div class="rc-head"><span>PAUSA CAFFÈ</span><span>${esc(stampNow())}</span></div>
      <div class="rc-sub">${esc(sub)}</div>
      <div class="rc-rule"></div>
      ${lines.map(lineHTML).join('')}
      ${chain ? '<canvas class="rc-chain" id="rcChain" aria-hidden="true"></canvas>' : ''}
      <div class="rc-rule"></div>
      <div class="rc-total"><span>${esc(totalLabel)}</span><span>${esc(total)}</span></div>
      ${after.join('')}
      ${carry ? `<div class="rc-rule"></div><div class="rc-line"><span>${esc(carry)}</span></div><canvas class="rc-tokens" id="rcTokens" aria-hidden="true"></canvas>` : ''}
      <div class="rc-rule"></div>
      <div class="rc-foot">${esc(t('rThanks'))}</div>
      ${link ? `<a class="rc-link" href="${COFFEE_IT_URL}" target="_blank" rel="noopener">${esc(t('rLink'))}&nbsp;↗</a>
        <a class="rc-link credit" href="${PORTFOLIO_URL}" target="_blank" rel="noopener">${esc(t('rCredit'))}&nbsp;↗</a>` : ''}`;
  }

  function showRoundReceipt(res) {
    sheetMode = 'round';
    const nextKind = roundKind(visit.round + 1);
    const carry = res.kind === 'maze' && res.carry.length ? res.carry : null;
    $('#receipt').innerHTML = receiptHTML({
      sub: t('round', { n: visit.round }) + ' · ' + res.title,
      lines: res.lines.map(([label, amt]) => [label, amt == null ? null : plus(amt)]),
      totalLabel: t('rRound'), total: res.total,
      after: [lineHTML([t('rVisit'), visit.tips])],
      chain: res.kind === 'merge',
      carry: carry ? t('rCarry', { items: carry.map(itemName).join(', ') }) : null,
    });
    $('#btnNext').textContent = t('nextRound', { name: t(nextKind) });
    $('#btnNext').classList.remove('again');
    $('#btnFinish').textContent = t('finish');
    showSheet('#sheet');
    requestAnimationFrame(() => {
      if (res.kind === 'merge') drawChain($('#rcChain'), { now: new Set(res.reached), ever: new Set(save.everItems) });
      if (carry) drawTokenRow($('#rcTokens'), carry);
    });
  }

  function showVisitReceipt(prevBest) {
    sheetMode = 'visit';
    const newBest = visit.tips > prevBest && visit.rounds.length > 0;
    $('#receipt').innerHTML = receiptHTML({
      sub: t('rVisitOver'),
      lines: visit.rounds.map((r) => (r.bonus ? [t('rPassBonus'), plus(r.bonus)] : [t('round', { n: r.n }) + ' · ' + r.title, String(r.total)])),
      totalLabel: t('rVisitTotal'), total: visit.tips,
      after: [newBest ? `<div class="rc-total best"><span>★ ${esc(t('rNewBest'))}</span><span></span></div>` : lineHTML([t('rBestVisit'), save.best])],
      link: true,
    });
    $('#btnNext').textContent = t('playAgain');
    $('#btnNext').classList.add('again');
    $('#btnFinish').textContent = t('done');
    showSheet('#sheet');
  }

  function showSheet(sel) {
    $('#scrim').hidden = false;
    const el = $(sel);
    el.hidden = false; el.scrollTop = 0;
    const first = el.querySelector('.btn.primary, button');
    if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
  }
  function hideSheets() { $('#scrim').hidden = true; $('#sheet').hidden = true; $('#settings').hidden = true; }

  function prepCanvas(canvas) {
    if (!canvas) return null;
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return null;
    const d = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(rect.width * d); canvas.height = Math.round(rect.height * d);
    const c = canvas.getContext('2d');
    c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, rect.width, rect.height);
    return { c, w: rect.width, h: rect.height };
  }

  // Both chains side by side, items standing on one baseline like pastries on a counter.
  function drawChain(canvas, opts) {
    const p = prepCanvas(canvas);
    if (!p) return;
    const { c, w, h } = p, gap = 5, mid = 18, sum = TIER_R.reduce((acc, r) => acc + r * 2, 0);
    const k = Math.min((w - gap * 6 - mid) / (sum * 2), (h - 4) / (TIER_R[TOP] * 2));
    let x = (w - (sum * 2 * k + gap * 6 + mid)) / 2;
    for (let item = 0; item < ITEMS.length; item++) {
      const r = radiusOf(item) * k;
      x += r;
      const y = h - 2 - r;
      const now = !opts || opts.now.has(item), ever = !opts || opts.ever.has(item);
      if (now || ever) {
        c.globalAlpha = now ? 1 : 0.3;
        drawToken(c, item, x, y, r);
        c.globalAlpha = 1;
      } else {
        c.beginPath(); c.arc(x, y, r - 1, 0, TAU);
        c.setLineDash([3, 3]); c.lineWidth = 1.5; c.strokeStyle = theme.receiptInk; c.stroke(); c.setLineDash([]);
        c.font = '700 ' + Math.round(r * 0.9) + 'px ' + BODY; c.fillStyle = theme.receiptInk;
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', x, y + 1);
      }
      x += r + (item === 3 ? mid : gap);
    }
  }

  function drawTokenRow(canvas, items) {
    const p = prepCanvas(canvas);
    if (!p) return;
    const { c, w, h } = p, gap = 8, sum = items.reduce((acc, item) => acc + radiusOf(item) * 2, 0);
    const k = Math.min((w - gap * (items.length - 1)) / sum, (h - 4) / (TIER_R[2] * 2));
    let x = (w - (sum * k + gap * (items.length - 1))) / 2;
    for (const item of items) {
      const r = radiusOf(item) * k;
      x += r;
      drawToken(c, item, x, h - 2 - r, r);
      x += r + gap;
    }
  }

  /* ================= Playtest panel ================= */
  function levelLabel(level) {
    if (level <= 0) return t('lvlTut');
    const spec = levelSpec(level);
    const pass = save.settings.passage === false || !spec.pass ? '' : spec.pass >= 1 ? t('lvlPassAlways') : t('lvlPassSome');
    return t('lvl', { n: level, s: spec.n, k: spec.k, min: spec.min, max: spec.max, pass });
  }

  function median(values) {
    if (!values.length) return null;
    const s = values.slice().sort((a, b) => a - b), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function markPressed(sel, isOn) {
    for (const b of document.querySelectorAll(sel + ' button')) b.setAttribute('aria-pressed', String(isOn(b.dataset.v)));
  }

  function renderSettings() {
    const st = save.settings;
    markPressed('#setCup', (v) => v === st.cup);
    markPressed('#setSpawn', (v) => Number(v) === st.spawn);
    markPressed('#setMilk', (v) => (v === '1') === (st.milk !== false));
    markPressed('#setRise', (v) => (v === '1') === (st.rise !== false));
    markPressed('#setCross', (v) => v === st.cross);
    markPressed('#setPass', (v) => (v === '1') === (st.passage !== false));
    $('#setLevel').textContent = save.mazeLevel;
    $('#levelDesc').textContent = levelLabel(save.mazeLevel);
    const L = save.log, box = $('#logStats');
    if (!L.length) { box.innerHTML = `<p class="panel-note">${esc(t('logEmpty'))}</p>`; return; }
    const maze = L.filter((r) => r.kind === 'maze'), cup = L.filter((r) => r.kind === 'merge');
    const secs = (rows) => { const m = median(rows.map((r) => r.seconds)); return m == null ? '–' : Math.round(m) + ' s (' + rows.length + ')'; };
    const share = (rows, test) => (rows.length ? Math.round((100 * rows.filter(test).length) / rows.length) + '%' : '–');
    const rows = [
      [t('logRounds'), L.length],
      [t('logMaze'), secs(maze)],
      [t('logMerge'), secs(cup)],
      [t('logDrops'), cup.length ? Math.round(median(cup.map((r) => r.drops || 0))) : '–'],
      [t('logSpill'), share(cup, (r) => r.ending === 'spill')],
      [t('logBonus'), share(cup, (r) => r.serve_bonus > 0)],
      [t('logClutch'), share(cup, (r) => r.clutch === 1)],
      [t('logHints'), share(maze, (r) => r.hints > 0)],
      [t('logPass'), share(maze.filter((r) => r.passage), (r) => r.passed === 1)],
      [t('logTier'), cup.length ? (cup.reduce((a, r) => a + (r.best_tier || 0), 0) / cup.length).toFixed(1) + ' / 4' : '–'],
    ];
    box.innerHTML = '<dl>' + rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl>';
  }

  const CSV_COLS = ['ts', 'round', 'kind', 'seconds', 'tips', 'level', 'board', 'pairs', 'detour', 'passage', 'passed', 'moves', 'filled', 'clean', 'cross',
    'hints', 'carried', 'drops', 'ending', 'best_tier', 'merges', 'tops', 'fill', 'serve_bonus', 'clutch', 'pass_bonus', 'cup', 'spawn', 'milk', 'rise'];
  const csv = () => [CSV_COLS.join(',')].concat(save.log.map((r) => CSV_COLS.map((k) => (r[k] == null ? '' : r[k])).join(','))).join('\n');

  function flashLabel(btn, text) {
    const key = btn.dataset.i18n;
    btn.textContent = text;
    setTimeout(() => { btn.textContent = t(key); }, 1600);
  }

  /* ================= Static copy ================= */
  function applyStrings() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-i18n]')) {
      if (el.hasAttribute('data-header')) el.innerHTML = headerHTML(t(el.dataset.i18n));
      else el.textContent = t(el.dataset.i18n);
    }
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
    $('#btnLang').textContent = t('language');
    $('#btnQuit').setAttribute('aria-label', t('quitLabel'));
    $('#btnCloseSettings').setAttribute('aria-label', t('closeLabel'));
    $('#quitTxt').textContent = t('quit');
  }

  /* ================= Input ================= */
  let activePointer = null;
  const toLocal = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const isControl = (el) => !!(el && el.closest && el.closest('button, a, .sheet, .home, .scrim'));

  function begin(id, target, point) {
    if (!scene || activePointer !== null || isControl(target)) return false;
    activePointer = id;
    scene.down.apply(scene, toLocal(point));
    return true;
  }
  function moveTo(point) { if (scene) scene.move.apply(scene, toLocal(point)); }
  function finishInput(point, cancelled) {
    activePointer = null;
    if (scene) scene.up.apply(scene, toLocal(point).concat([cancelled]));
  }

  if (window.PointerEvent) {
    app.addEventListener('pointerdown', (e) => {
      if (!begin(e.pointerId, e.target, e)) return;
      try { app.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
      e.preventDefault();
    });
    app.addEventListener('pointermove', (e) => { if (e.pointerId === activePointer) moveTo(e); });
    const release = (e) => { if (e.pointerId === activePointer) finishInput(e, e.type === 'pointercancel'); };
    app.addEventListener('pointerup', release);
    app.addEventListener('pointercancel', release);
  } else {
    // Browsers without Pointer Events (iOS before 13): the first touch, or the mouse, drives the same handlers.
    const touchOf = (list) => { for (let i = 0; i < list.length; i++) if (list[i].identifier === activePointer) return list[i]; return null; };
    app.addEventListener('touchstart', (e) => { const tch = e.changedTouches[0]; if (begin(tch.identifier, e.target, tch)) e.preventDefault(); }, { passive: false });
    app.addEventListener('touchmove', (e) => { const tch = touchOf(e.changedTouches); if (tch) { e.preventDefault(); moveTo(tch); } }, { passive: false });
    const touchEnd = (e) => { const tch = touchOf(e.changedTouches); if (tch) finishInput(tch, e.type === 'touchcancel'); };
    app.addEventListener('touchend', touchEnd);
    app.addEventListener('touchcancel', touchEnd);
    app.addEventListener('mousedown', (e) => { if (begin('mouse', e.target, e)) e.preventDefault(); });
    window.addEventListener('mousemove', (e) => { if (activePointer === 'mouse') moveTo(e); });
    window.addEventListener('mouseup', (e) => { if (activePointer === 'mouse') finishInput(e, false); });
  }

  // Leaving the page (barista calls, phone locks) never costs a drop: an aim in progress is cancelled.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && scene && activePointer !== null) { activePointer = null; scene.up(0, 0, true); }
    last = performance.now();
  });

  /* ================= Buttons ================= */
  $('#btnPlay').addEventListener('click', startVisit);
  $('#btnServe').addEventListener('click', () => { if (scene) scene.serve(); });
  $('#btnHint').addEventListener('click', () => { if (scene && scene.kind === 'maze') scene.hint(); });
  $('#btnRestart').addEventListener('click', () => { if (scene && scene.kind === 'maze') scene.restart(); });
  $('#btnNext').addEventListener('click', () => { if (sheetMode === 'round') nextRound(); else startVisit(); });
  $('#btnFinish').addEventListener('click', () => { if (sheetMode === 'round') finishVisit(); else showHome(); });

  // Quit asks twice, inline: browsers inside the app frame cannot show confirm dialogs.
  let quitArmedAt = 0, quitTimer = 0;
  function disarmQuit() {
    quitArmedAt = 0; clearTimeout(quitTimer);
    $('#btnQuit').classList.remove('armed'); $('#quitTxt').hidden = true; $('#quitIcon').hidden = false;
  }
  $('#btnQuit').addEventListener('click', () => {
    if (quitArmedAt && Date.now() - quitArmedAt < 3000) {
      disarmQuit();
      // Leaving costs nothing already earned: a cup in progress is served on the way out. An unfinished maze has no score yet.
      if (scene && scene.kind === 'merge' && !scene.reported) {
        scene.end('served'); scene.reported = true;
        recordRound(scene.results());
      }
      if (visit.rounds.length) finishVisit(); else showHome();
      return;
    }
    quitArmedAt = Date.now();
    $('#btnQuit').classList.add('armed'); $('#quitTxt').hidden = false; $('#quitIcon').hidden = true;
    clearTimeout(quitTimer); quitTimer = setTimeout(disarmQuit, 3000);
  });

  $('#btnLang').addEventListener('click', () => {
    lang = lang === 'it' ? 'en' : 'it';
    save.settings.lang = lang; persist();
    applyStrings(); showHome();
  });

  $('#btnSettings').addEventListener('click', () => { renderSettings(); showSheet('#settings'); });
  $('#btnCloseSettings').addEventListener('click', hideSheets);
  $('#scrim').addEventListener('click', () => { if (!$('#settings').hidden) hideSheets(); });

  const setSetting = (key, value) => { save.settings[key] = value; persist(); renderSettings(); };
  const onSeg = (sel, fn) => $(sel).addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) fn(b.dataset.v); });
  onSeg('#setCup', (v) => setSetting('cup', v));
  onSeg('#setSpawn', (v) => setSetting('spawn', Number(v)));
  onSeg('#setMilk', (v) => setSetting('milk', v === '1'));
  onSeg('#setRise', (v) => setSetting('rise', v === '1'));
  onSeg('#setCross', (v) => setSetting('cross', v));
  onSeg('#setPass', (v) => setSetting('passage', v === '1'));
  // Players can always go back to the game as designed; the language they picked stays.
  $('#btnDefaults').addEventListener('click', (e) => {
    save.settings = Object.assign({}, DEFAULTS, { lang: save.settings.lang });
    persist(); renderSettings();
    flashLabel(e.currentTarget, t('defaultsDone'));
  });
  const setLevel = (level) => { save.mazeLevel = clamp(level, 0, 15); persist(); renderSettings(); };
  $('#lvlMinus').addEventListener('click', () => setLevel(save.mazeLevel - 1));
  $('#lvlPlus').addEventListener('click', () => setLevel(save.mazeLevel + 1));

  $('#btnCopyLog').addEventListener('click', (e) => {
    const btn = e.currentTarget, text = csv(), ta = $('#logCsv');
    ta.value = text;
    const fallback = () => { ta.hidden = false; ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(text).then(() => flashLabel(btn, t('copied')), fallback); } catch (err) { fallback(); }
  });
  $('#btnClearLog').addEventListener('click', (e) => {
    save.log = []; persist(); renderSettings(); $('#logCsv').hidden = true;
    flashLabel(e.currentTarget, t('cleared'));
  });

  let resetArmedAt = 0;
  $('#btnReset').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (resetArmedAt && Date.now() - resetArmedAt < 4000) {
      resetArmedAt = 0;
      Object.assign(save, { best: 0, lifetime: 0, mazeLevel: 0, mergeTutDone: false, passTutDone: false, log: [], recentBoards: [], everItems: [] });
      persist(); renderSettings();
      flashLabel(btn, t('resetDone'));
      return;
    }
    resetArmedAt = Date.now();
    flashLabel(btn, t('resetConfirm'));
  });

  /* ================= Boot ================= */
  function refreshTheme() {
    readTheme();
    if (!$('#home').hidden) drawChain($('#chainCv'));
  }
  const relayout = () => { resize(); if (!$('#home').hidden) drawChain($('#chainCv')); };
  onMediaChange(window.matchMedia('(prefers-color-scheme: dark)'), refreshTheme);
  if (window.MutationObserver) new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.ResizeObserver) {
    new ResizeObserver(relayout).observe(cv);
    new ResizeObserver(() => { if (scene) scene.layout(); }).observe($('#top'));
  } else {
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => setTimeout(relayout, 250));
  }
  if (document.fonts && document.fonts.load) {
    document.fonts.load('20px "Coffee Town"').then(() => { if (!$('#home').hidden) drawChain($('#chainCv')); }).catch(() => {});
  }

  // Hooks for the balance and maze tools that ship with this prototype; harmless for players.
  window.__pausaCaffe = { makeBoard, minExtra, levelSpec, mulberry32, CupWorld, surfaceFill, rimCheck, ITEMS, TIER_R, TIER_PTS, TOP,
    CUP_HEIGHT, SPAWN_WEIGHTS, RISE_PER_DROP, FILL_BONUS, STEP, TOSS, get scene() { return scene; }, startVisit };

  // The settings panel is for players. The playtest tools (next maze, log, reset progress) appear only with ?playtest
  // (or #playtest) in the address.
  const PLAYTEST = /playtest/i.test(location.search + location.hash);
  const showPlaytest = () => { for (const el of document.querySelectorAll('[data-playtest]')) el.hidden = !PLAYTEST; };

  function boot(data) {
    showPlaytest();
    readTheme(); applyStrings(); resize();
    if (data && data.visit && data.inRound) {
      Object.assign(visit, data.visit);
      visit.round = Math.max(0, visit.round - 1);
      $('#home').hidden = true;
      nextRound();
    } else showHome();
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ visit: JSON.parse(JSON.stringify(visit)), inRound: !!scene && !scene.reported }));
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
