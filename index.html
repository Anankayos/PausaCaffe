/* Layout: one thumb-first column. Boards sit low, the chrome is printed in a single espresso ink like a sugar packet,
   colour only ever carries gameplay meaning (Okabe–Ito hues on the pieces), and every round ends on a till receipt. */
:root {
  --paper: #EBE4D2;        /* cream ground, rgb(235, 228, 210) */
  --card: #FFFFFF;         /* board plate, cup interior, panels */
  --ink: #1D1511;          /* espresso ink: text, outlines, primary buttons */
  --ink-2: #5E544D;        /* secondary text */
  --rule: rgba(29, 21, 17, 0.16);
  --on-ink: #F4F4F0;       /* text on ink */
  --casing: #1D1511;       /* outline around game pieces and paths */
  --warn: #B84A00;         /* overflow and blocked moves: semantic, never decorative */
  --note: #FFF4DC;         /* cream capsule for tutorial hints, the same in both themes */
  --note-ink: #1D1511;
  --note-edge: #E0C48E;
  --note-warn: #A94300;
  --focus: #0072B2;
  --scrim: rgba(235, 228, 210, 0.86);
  --receipt: #FFFFFF;
  --receipt-ink: #1D1511;
  --receipt-rule: rgba(29, 21, 17, 0.38);

  --font-display: "Coffee Town", "Helvetica Neue", Helvetica, Arial, sans-serif;  /* headers only */
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;                     /* everything else */
  --moka: #0072B2;         /* the moka's blue: status capsules */
  --cup-green: #009E73;    /* the espresso cup's green: Play and Serve */
  --latte-pink: #CC79A7;   /* the latte's pink: Play again */
  --header-lh: 1.2;        /* Coffee Town headers: room for drawn accents, see .acc */
  --acc-top: -0.083em;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Roboto Mono", monospace;

  --gl: 16px;
  --gr: 16px;
}
@supports (padding: max(0px)) {
  :root {
    --gl: max(16px, env(safe-area-inset-left, 0px));
    --gr: max(16px, env(safe-area-inset-right, 0px));
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14100D; --card: #1F1813; --ink: #F1ECE4; --ink-2: #B3A79C; --rule: rgba(241, 236, 228, 0.16);
    --on-ink: #14100D; --casing: #0A0706; --warn: #FF8F57; --focus: #56B4E9; --scrim: rgba(20, 16, 13, 0.86);
    --receipt: #E6E0D5; --receipt-ink: #1D1511; --receipt-rule: rgba(29, 21, 17, 0.38);
    --note: #F4E7CD; --note-ink: #1D1511; --note-edge: #F4E7CD; --note-warn: #A94300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14100D; --card: #1F1813; --ink: #F1ECE4; --ink-2: #B3A79C; --rule: rgba(241, 236, 228, 0.16);
  --on-ink: #14100D; --casing: #0A0706; --warn: #FF8F57; --focus: #56B4E9; --scrim: rgba(20, 16, 13, 0.86);
  --receipt: #E6E0D5; --receipt-ink: #1D1511; --receipt-rule: rgba(29, 21, 17, 0.38);
  --note: #F4E7CD; --note-ink: #1D1511; --note-edge: #F4E7CD; --note-warn: #A94300;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}

#app {
  position: relative; height: 100%; max-width: 480px; margin-left: auto; margin-right: auto;
  padding-left: var(--gl); padding-right: var(--gr);
  overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#cv { display: block; width: 100%; height: 100%; }
.layer { position: absolute; left: var(--gl); right: var(--gr); }

/* ---------- Buttons ---------- */
button { font: inherit; color: inherit; }
.btn {
  border: 0; cursor: pointer; border-radius: 16px; min-height: 56px; padding: 0 22px;
  font-family: var(--font-body); font-weight: 700; font-size: 18px; letter-spacing: 0.01em;
}
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.big { width: 100%; min-height: 64px; font-size: 22px; }
/* Play and Serve wear the espresso cup's green. White bold text on it is 3.4:1, which passes AA only as large text
   (bold from 18.67 px): Play is 22 px, Serve and Next 19 px. During a rim warning Serve still turns orange: danger. */
#btnPlay, #btnServe, #btnNext { background: var(--cup-green); color: #FFFFFF; }
#btnServe, #btnNext { font-size: 19px; }
/* Play again wears the latte's pink, with espresso ink: 5.9:1 (white on this pink would be only 3.1:1). */
#btnNext.again { background: var(--latte-pink); color: #1D1511; }
#btnServe.urgent { background: var(--warn); color: var(--on-ink); }
.icon-btn {
  min-width: 44px; height: 44px; padding: 0 10px; border: 0; border-radius: 12px; background: transparent; color: var(--ink);
  display: inline-grid; place-items: center; cursor: pointer; box-shadow: inset 0 0 0 1.5px var(--rule);
}
.icon-btn.armed { background: var(--warn); color: var(--on-ink); box-shadow: none; font-weight: 700; font-size: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); font: 600 13px var(--font-body); cursor: pointer;
}
.link-btn {
  border: 0; background: transparent; color: var(--ink); min-height: 44px; padding: 0 4px; cursor: pointer;
  font: 600 14px var(--font-body); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .link-btn:focus-visible, .seg button:focus-visible, .stepper button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- In-round HUD ---------- */
.top { top: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; pointer-events: none; }
.top button { pointer-events: auto; }
.hud { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.hud-title { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hud-round, .hud-tips span, .sorted {
  font-family: var(--font-body); font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
}
.hud-name {
  font-family: var(--font-display); font-weight: 400; font-synthesis: none; font-size: clamp(17px, 5.6vw, 21px); line-height: var(--header-lh);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; /* wraps on narrow phones */
}
.hud-tips { display: flex; flex-direction: column; align-items: flex-end; }
.hud-tips b {
  font-family: var(--font-display); font-weight: 400; font-synthesis: none; font-size: 28px; line-height: 1;
  font-variant-numeric: tabular-nums; transition: transform 0.15s ease-out;
}
.hud-tips b.bump { transform: scale(1.18); }
/* The hint: a cream capsule right above the board or the cup, where the eyes already are. Its left edge sits on
   the board's or the cup's left edge (set by the scene); it hugs short text and grows upward for a second line. */
.status { top: 0; height: 74px; display: flex; align-items: flex-end; pointer-events: none; }
.hint {
  margin: 0; max-width: 100%; padding: 7px 18px; border-radius: 999px;
  background: var(--note); color: var(--note-ink); box-shadow: inset 0 0 0 1.5px var(--note-edge), 0 1px 3px rgba(29, 21, 17, 0.12);
  font-size: 14.5px; font-weight: 500; line-height: 1.35; text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.hint:empty { display: none; }
/* Lines are frozen by the script once the browser has balanced them; the capsule then hugs its longest line. */
.hint.hug { display: block; width: max-content; max-width: none; white-space: nowrap; }
.hint.warn { color: var(--note-warn); font-weight: 700; box-shadow: inset 0 0 0 2px var(--note-warn), 0 1px 3px rgba(29, 21, 17, 0.12); }

.bottombar {
  bottom: 0; height: 124px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 10px;
  padding-bottom: 14px; pointer-events: none;
}
/* Status in the moka's blue: how many pairs are joined, or the next fill mark. */
.pill {
  margin: 0; max-width: 100%; border-radius: 999px; background: var(--moka); color: #FFFFFF;
  font-size: 13px; font-weight: 700; line-height: 1.3; letter-spacing: 0.04em; text-transform: uppercase; text-align: center;
  /* Capitals have no descenders, so a plain line box sits them high: a little more room on top centres them.
     The right side gives back the trailing letter-spacing. */
  padding: 7.5px calc(16px - 0.04em) 4.5px 16px;
}
@supports (text-box: trim-both cap alphabetic) {
  .pill { text-box: trim-both cap alphabetic; padding-top: 9px; padding-bottom: 9px; } /* exact: trim to the capitals */
}
.pill { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* one line, always */
.pill:empty { visibility: hidden; }
/* The actions sit right below the capsule, centred and in thumb reach. The row keeps its height so nothing jumps. */
.actions { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; pointer-events: auto; }
.btn.small { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; font-size: 16px; }

/* A new fill mark pops the button once; something over the rim makes it urgent until the cup is safe or served. */
.btn.bump { animation: bump 0.32s ease-out; }
.btn.primary.urgent { background: var(--warn); color: var(--on-ink); animation: urgent 0.7s ease-in-out infinite alternate; }
@keyframes bump { 40% { transform: scale(1.08); } }
@keyframes urgent { to { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) { .btn.bump, .btn.primary.urgent { animation: none; } }

/* ---------- Start screen: the sugar packet ---------- */
.home {
  top: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px;
  padding-top: 18px; padding-bottom: 16px; background: var(--paper); overflow-y: auto; touch-action: pan-y;
}
.packet {
  --tooth: 9px;
  position: relative; margin-block: auto; background: var(--ink); color: var(--on-ink); padding: 40px 22px 34px;
  -webkit-mask:
    conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(2 * var(--tooth)) 51% repeat-x,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--tooth)) 51% repeat-x;
  mask:
    conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / calc(2 * var(--tooth)) 51% repeat-x,
    conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(2 * var(--tooth)) 51% repeat-x;
}
.tear {
  position: absolute; top: 22px; left: 0; right: 0; border-top: 1.5px dashed currentColor; opacity: 0.55;
  display: flex; justify-content: flex-end; padding-right: 14px;
}
.tear span { font-family: var(--font-body); font-weight: 700; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px; }
.packet-eyebrow { margin: 12px 0 8px; font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
.packet-title {
  margin: 0 0 20px; font-family: var(--font-display); font-weight: 400; font-synthesis: none;
  font-size: clamp(48px, 16vw, 72px); line-height: var(--header-lh); text-wrap: balance;
}
/* Coffee Town has no accented letters, so headers draw the accent over the letter in the same ink. Its ink reaches
   0.81em above the baseline and 0.09em below; at line-height 1.2 an accent sits 0.04em above its capital and still
   clears the line above by about 0.08em. Every Coffee Town header uses this line height. */
.acc { position: relative; display: inline-block; }
.acc::after {
  content: ""; position: absolute; left: 50%; top: var(--acc-top); width: 0.12em; height: 0.24em; margin-left: -0.06em;
  background: currentColor; border-radius: 0.06em; transform: rotate(-50deg);
}
.acc.acute::after { transform: rotate(50deg); }
.chain { display: block; width: 100%; height: 60px; }
.packet-tag { margin: 18px 0 14px; max-width: 30ch; font-size: 16px; line-height: 1.4; }
.packet-net { margin: 0; font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; text-wrap: balance; }
.home-foot { display: flex; flex-direction: column; gap: 12px; }
.home-best { margin: 0; text-align: center; font-size: 14px; color: var(--ink-2); }
.home-links { display: flex; justify-content: space-between; gap: 12px; }

/* ---------- Sheets: receipt and playtest panel ---------- */
.scrim { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: var(--scrim); }
.sheet {
  bottom: 0; max-height: 100%; overflow-y: auto; touch-action: pan-y; padding-top: 16px; padding-bottom: 14px;
  display: flex; flex-direction: column; gap: 14px;
}
.receipt-wrap { filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.12)); }
.receipt {
  --tooth: 7px;
  width: 100%; max-width: 360px; margin-left: auto; margin-right: auto; padding: 20px 18px 30px;
  background: var(--receipt); color: var(--receipt-ink);
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.55;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--tooth)) 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--tooth)) 100%;
  animation: print 0.55s ease-out both;
}
@keyframes print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 -24px 0); } }
.rc-head, .rc-line, .rc-total { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.rc-head { font-weight: 700; }
.rc-sub { text-transform: uppercase; letter-spacing: 0.06em; }
.rc-rule { margin: 10px 0; border-top: 1.5px dashed var(--receipt-rule); }
.rc-line span:first-child { min-width: 0; }
.rc-line span:last-child { white-space: nowrap; }
.rc-total { font-weight: 800; font-size: 17px; }
.rc-total.best { font-size: 14px; }
.rc-foot { text-align: center; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; }
.rc-chain { display: block; width: 100%; height: 62px; margin-top: 10px; }
.rc-tokens { display: block; width: 100%; height: 44px; margin-top: 6px; }
.rc-link {
  display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 6px;
  color: var(--receipt-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}
.rc-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.rc-link.credit { margin-top: 0; font-weight: 400; font-size: 12.5px; }
.sheet-actions { width: 100%; max-width: 360px; margin-left: auto; margin-right: auto; display: flex; flex-direction: column; gap: 10px; }

/* The card sits at the bottom when it fits; when it is taller than the screen it scrolls from its top. (flex-end
   alignment would push the overflow upward, where it can never be scrolled to.) */
.panel { justify-content: flex-start; }
.panel > .panel-card { margin-top: auto; }
.panel-card {
  background: var(--card); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 0 0 1.5px var(--rule), 0 18px 40px rgba(0, 0, 0, 0.18);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-synthesis: none; font-size: 22px; line-height: var(--header-lh); }
.panel-note { margin: 0; font-size: 14px; color: var(--ink-2); }
.field { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
/* Multiple choice: the label on top, the choices below. On/off switches stay on one line. */
.field.stack { flex-direction: column; align-items: flex-start; }
.btn.small-text { font-size: 16px; }
/* Settings: one group per game, its name on top in the header font. */
.set-group { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; border-top: 1.5px dashed var(--rule); }
.set-head { margin: 0; font-family: var(--font-display); font-weight: 400; font-synthesis: none; font-size: 19px; line-height: var(--header-lh); }
.field > span { font-weight: 600; font-size: 15px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--rule); font-size: 20px; cursor: pointer;
}
.stepper output {
  min-width: 3ch; text-align: center; font-family: var(--font-body); font-weight: 700; font-size: 18px;
  font-variant-numeric: tabular-nums;
}
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--rule); }
.seg button {
  min-height: 38px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; color: var(--ink);
  font: 600 14px var(--font-body); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.level-out { width: 100%; margin: 0; text-align: right; font-size: 13px; color: var(--ink-2); }
.log { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1.5px dashed var(--rule); }
.log h3 { margin: 0; font-size: 15px; }
.log dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; }
.log dt { color: var(--ink-2); }
.log dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.log-actions { display: flex; flex-wrap: wrap; gap: 8px; }
#logCsv {
  width: 100%; height: 120px; padding: 8px; border: 1.5px solid var(--rule); border-radius: 8px;
  background: var(--paper); color: var(--ink); font: 12px var(--font-mono); user-select: text; -webkit-user-select: text;
}

@media (prefers-reduced-motion: reduce) {
  .receipt { animation: none; }
  .hud-tips b { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" role="img" aria-label="Pausa Caffè"></canvas>

  <div class="top layer" id="top" hidden>
    <header class="hud">
      <button class="icon-btn" id="btnQuit" type="button" aria-label="Quit">
        <svg id="quitIcon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 3.5l11 11M14.5 3.5l-11 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span id="quitTxt" hidden></span>
      </button>
      <div class="hud-title"><span class="hud-round" id="hudRound"></span><span class="hud-name" id="hudName"></span></div>
      <div class="hud-tips"><b id="hudTips">0</b><span data-i18n="tips"></span></div>

  </div>

  <div class="status layer" id="status" hidden>
    <p class="hint" id="hint" aria-live="polite"></p>
  </div>

  <div class="bottombar layer" id="bottomBar" hidden>
    <p class="pill" id="statusPill" aria-live="polite"></p>
    <div class="actions">
      <button class="btn ghost small" id="btnRestart" type="button" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.3 8.6a4.8 4.8 0 1 0 1.4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M2.6 2.1v3h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="restart"></span>
      </button>
      <button class="btn ghost small" id="btnHint" type="button" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8a4.4 4.4 0 0 0-2.6 8c.5.4.8.9.8 1.5v.5h3.6v-.5c0-.6.3-1.1.8-1.5A4.4 4.4 0 0 0 8 1.8zM6.4 14.2h3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="hintBtn"></span>
      </button>
      <button class="btn primary" id="btnServe" type="button" hidden><span id="serveLabel" data-i18n="serve"></span></button>
    </div>
  </div>

  <section class="home layer" id="home" aria-labelledby="homeTitle">
    <div class="packet">
      <div class="tear" aria-hidden="true"><span data-i18n="tearHere"></span></div>
      <p class="packet-eyebrow" data-i18n="eyebrow"></p>
      <h1 class="packet-title" id="homeTitle">Pausa<br>Caff<span class="acc">è</span></h1>
      <canvas class="chain" id="chainCv" aria-hidden="true"></canvas>
      <p class="packet-tag" data-i18n="tagline"></p>
      <p class="packet-net" data-i18n="netWeight"></p>

        <button class="link-btn" id="btnSettings" type="button" data-i18n="settings"></button>
      </div>

  <div class="scrim" id="scrim" hidden></div>

      <p class="panel-note" data-i18n="fontCredit"></p>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  /* ================= Helpers ================= */
  // Written for every current browser: ES2019 syntax only (no ?. or ??), and fallbacks for APIs older phones lack.
  const TAU = Math.PI * 2;
  const $ = (sel) => document.querySelector(sel);

  /* ================= Maze: boards ================= */
  // First board ever: two pairs, and the cups' full-fill route is a simple snake.
  const TUTORIAL = { n: 4, pairs: [
    { a: 0, b: 3, item: 0, sol: [0, 1, 2, 3] },
    { a: 4, b: 15, item: 1, sol: [4, 5, 6, 7, 11, 10, 9, 8, 12, 13, 14, 15] },
  ] };

  // Difficulty by level: board size, pairs, the detour a board must force, and how often a passage appears.
  // "Detour" is the fewest extra cells, summed over all pairs, needed to join everything without crossings.
  // 0 means every pair can take its straightest route at the same time: an obvious board, never served.
  function levelSpec(level) {
    // cost: how many extra cells crossing the passage may cost; it grows with the level.
    if (level <= 0) return { n: 4, k: 2, min: 0, max: 0, pass: 0 };
    if (level <= 2) return { n: 5, k: 3, min: 2, max: 4, pass: 0 };
    if (level <= 4) return { n: 5, k: 3, min: 2, max: 6, pass: 1, cost: [2, 2] }; // the passage arrives gently
    if (level <= 7) return { n: 6, k: 3, min: 4, max: 8, pass: 0.6, cost: [2, 4] };
    if (level <= 11) return { n: 6, k: 4, min: 4, max: 8, pass: 0.6, cost: [4, 4] };

  const neighbourCache = {};
  function neighbours(n) {
    if (neighbourCache[n]) return neighbourCache[n];

      const r = (i / n) | 0, c = i % n, list = [];

  // A random path through every cell, cut into k segments of 3+ cells whose ends are not neighbours. Each segment
  // becomes a pair, so the board can always be solved with every cell filled.
  function candidate(n, k, rng) {
    const N = n * n, nb = neighbours(n);

    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) path.push(r * n + (r % 2 ? n - 1 - c : c));
    for (let it = 0; it < N * 40; it++) { // "backbite" moves shuffle the path while keeping it whole

        segs.push(path.slice(at, at + L)); at += L;

    }

  // The detour solver: iterative deepening on the total extra length, depth-first routing one pair at a time.
  // With a passage ({ cell, pair }), only that pair may use the cell and its route must run through it.
  function minExtra(n, pairs, cap, deadline, gate, from) {
    const N = n * n, nb = neighbours(n), k = pairs.length;

    const owner = new Int8Array(N).fill(-1);
    pairs.forEach((p, i) => { owner[p.a] = i; owner[p.b] = i; });
    const order = pairs.map((_, i) => i).sort((i, j) => gridDist(n, pairs[i].a, pairs[i].b) - gridDist(n, pairs[j].a, pairs[j].b));

  /* ================= Maze scene ================= */

    constructor(level) {

      if (!board.tutorial) { save.recentBoards = save.recentBoards.concat(layoutKey(board.n, board.pairs)).slice(-30); persist(); }
      this.level = level; this.n = board.n; this.N = board.n * board.n; this.tutorial = board.tutorial;
      this.cross = save.settings.cross;

      this.endpoint = new Array(this.N).fill(-1);
      this.pairs.forEach((p, i) => { this.endpoint[p.a] = i; this.endpoint[p.b] = i; });
      this.paths = this.pairs.map(() => []);

      this.passed = false; this.restarts = 0; this.hints = []; this.hintOffered = false;

      this.layout();

    }

    layout() {

    cellAt(x, y) {

    refreshSorted() {
